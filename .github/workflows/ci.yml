name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SDL3 release to build on Linux (apt has no SDL3 on current Ubuntu). Bump to
  # pick up a newer SDL3; macOS uses whatever Homebrew ships.
  SDL3_REF: release-3.2.0

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/sdl3/lib
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libgl-dev libegl-dev

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ runner.os }}-${{ env.SDL3_REF }}-v1

      - name: Build SDL3 from source
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL3_REF" https://github.com/libsdl-org/SDL
          cmake -S SDL -B SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3 \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build SDL/build
          sudo cmake --install SDL/build

      - name: Build emulator
        run: make _out/jonboy

      - name: Build amalgamation
        run: make amalg

      # The MIPS self-test carts and the loader PS-EXE are not built here: stock
      # Ubuntu has no mipsel bare-metal toolchain. The host unit tests give the
      # subsystem coverage.
      - name: Host unit tests
        run: |
          make cdda-test spu-test xa-test mc-test loader-test pad-test \
               script-test mdec-test gte-test gpu-thread-test gpu-readback-test

  macos:
    name: macOS ${{ matrix.arch }} (build + app)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # Apple Silicon
            arch: arm64
          - os: macos-13   # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # tags/history so the Makefile's git-describe version works

      - name: Install dependencies
        run: brew install sdl3 pkg-config

      - name: Build emulator
        run: make _out/jonboy

      - name: Host unit tests
        run: |
          make cdda-test spu-test xa-test mc-test loader-test pad-test \
               script-test mdec-test gte-test gpu-thread-test gpu-readback-test

      - name: Package app bundle
        run: make macos-app

      - name: Smoke-test app bundle
        run: |
          bin=_out/JonBoy.app/Contents/MacOS/jonboy
          otool -L "$bin"
          # The SDL3 dependency must point into the bundle, not at Homebrew.
          sdl=$(otool -L "$bin" | awk '/libSDL3/ {print $1; exit}')
          case "$sdl" in
            @executable_path/../Frameworks/libSDL3*) ;;
            *) echo "SDL3 not repointed into the bundle: $sdl"; exit 1 ;;
          esac
          # dyld loads the bundled SDL3 before main() runs, so a --help that
          # exits 0 proves the repoint resolves, with no display needed.
          "$bin" --help

      - name: Archive app bundle
        run: ditto -c -k --keepParent _out/JonBoy.app "_out/JonBoy-macos-${{ matrix.arch }}.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v6
        with:
          name: jonboy-macos-${{ matrix.arch }}
          path: _out/JonBoy-macos-${{ matrix.arch }}.zip
          retention-days: 14

  release:
    name: Attach macOS bundles to release
    needs: [linux, macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v6
        with:
          pattern: jonboy-macos-*
          merge-multiple: true
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --repo "${{ github.repository }}"
